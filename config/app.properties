# =====================================================================
#  Multi-agent email assistant - main configuration
#  (comments must be on their own line in .properties files)
# =====================================================================

# ---------- Local LLM ----------
# Provider: ollama | openai (any OpenAI-compatible local server: LM Studio, llama.cpp, vLLM...) | mock
llm.provider=ollama
# Ollama default: http://localhost:11434 - LM Studio default: http://localhost:1234
llm.baseUrl=http://localhost:11434
llm.model=qwen2.5:3b
# For thinking models (qwen3, deepseek-r1...): false = answer directly (much faster on CPU)
llm.think=false
llm.temperature=0.3
llm.maxTokens=500
# Context window requested from Ollama (tokens)
llm.contextWindow=4096
llm.timeoutSeconds=600
# Emails are confidential: non-local servers are refused unless this is set to true
llm.allowRemote=false

# ---------- Routing ----------
# Weighted vote between strategies: rules (Contract Net bids of the agents), llm (LLM classifier), thread (continuity)
routing.strategies=rules:1.0,llm:1.0,thread:0.5
# Below this score, no specialist is suitable: the fallback agent is used
routing.threshold=0.35
# If the two best agents are closer than this margin, the decision is flagged as ambiguous
routing.ambiguityMargin=0.10
routing.fallbackAgent=generic

# ---------- Memory ----------
# budget (most recent exchanges within the agent's token budget) | lastN
memory.window=budget
memory.lastN=6
memory.maxCharsPerMessage=1200

# ---------- Review ----------
review.enabled=true
review.autoRevise=true

# ---------- Paths ----------
paths.data=data
paths.memory=data/memory/threads
paths.log=logs/trace.log

# ---------- Experiments (--eval) ----------
eval.testset=data/testset
eval.output=results
# Routing configurations compared (separated by ';')
eval.routingConfigs=rules;llm;rules:1,llm:1;rules:1,llm:1,thread:0.5
eval.maxDraftCases=6
